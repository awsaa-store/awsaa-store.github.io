<style>

*{box-sizing:border-box}

body{margin:0}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}

.search input::-webkit-search-cancel-button{display:none}
[hidden]{display:none!important}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.1rem;padding:14px 48px 14px 44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.4rem;width:36px;height:36px;border-radius:8px;cursor:pointer}
.search .clear:focus-visible{outline:2px solid var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .num{position:absolute;top:6px;right:6px;font-family:var(--f-mono);font-size:.72rem;background:rgba(20,32,46,.78);color:#fff;padding:1px 6px;border-radius:5px}
.card .body{padding:10px 10px 12px;display:grid;gap:8px;flex:1;align-content:space-between}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pbtn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:8px;border:1px solid var(--line);color:var(--ink);cursor:pointer;flex:none}
.pbtn:hover{background:var(--bg)}
.pbtn:focus-visible{outline:2px solid var(--accent)}
.pbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
#label{display:none}
@page{size:105mm 148mm;margin:0}

.card .name{font-weight:600;font-size:.95rem;line-height:1.35;overflow-wrap:anywhere}

.loc .s{background:var(--ink);color:var(--bg);padding:2px 8px}
.loc.none{font-family:var(--f-body);color:var(--empty);border:1px dashed var(--empty);padding:1px 8px;font-size:.78rem}
mark{background:color-mix(in srgb,var(--sign) 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:60px 10px;display:grid;gap:6px}
.empty b{color:var(--ink);font-size:1.1rem}
/* detail sheet */
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,24,.55)}
.sheet .big{background:#fff;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;max-width:100%}
.sheet .big img{width:100%;height:100%;object-fit:contain}
.sheet .in{padding:16px 18px 18px;display:grid;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:1.3rem;margin:0;text-wrap:balance}
.sheet .meta{font-size:.8rem;color:var(--muted)}

.bigloc .aisle{background:var(--sign);color:var(--sign-ink)}
.bigloc .shelf{background:var(--ink);color:var(--bg)}
.bigloc .row{border:2px solid var(--ink)}
.noloc{color:var(--muted);font-size:.9rem}

.locwrap{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}

</dialog>

    h+='</div>';if(l.note)h+='<div class="note">'+esc(l.note)+'</div>';
    $("dLoc").innerHTML=h;
  } else $("dLoc").innerHTML='<div class="noloc">لسه ما تحددش مكان هذا المنتج.</div>';
}
function openP(id){
  current=P.find(p=>p.id===id);
  $("dImg").src=img(id);$("dImg").alt=current.name;$("dName").textContent=current.name;
  $("dMeta").textContent="منتج رقم "+id;
  const l=LOC[id]||{};
  $("fRack").value=l.rack||"";$("fDrawer").value=l.drawer||"";$("fBox").value=l.box||"";$("fNote").value=l.note||"";
  $("fStatus").textContent="";$("fStatus").className="status";
  $("dForm").hidden=false;
  try{$("fPin").value=localStorage.getItem("awsaa_pin")||""}catch(e){}
  showLoc();
  $("dlg").showModal();
}
$("dClose").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});

async function save(data){
  const st=$("fStatus");st.className="status";
  if(!READY){st.textContent="التعديل يشتغل بعد ربط جدول قوقل.";return}
  const pin=$("fPin").value.trim();if(!pin){st.textContent="اكتب الرمز السري الأول.";$("fPin").focus();return}
  st.textContent="جاري الحفظ…";$("fSave").disabled=true;$("fClear").disabled=true;
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pin,id:current.id},data))});
    const j=await r.json();
    if(j.ok){try{localStorage.setItem("awsaa_pin",pin)}catch(e){}
      LOC[current.id]=Object.assign({},data);st.className="status ok";st.textContent=data.rack?"تم الحفظ ✓":"تم مسح المكان";showLoc();render();}
    else if(j.error==="pin"){st.textContent="الرمز السري غلط.";}
    else st.textContent="ما تمش الحفظ، جرب مرة ثانية.";
  }catch(e){st.textContent="ما تمش الحفظ. تأكد من النت وجرب مرة ثانية.";}
  $("fSave").disabled=false;$("fClear").disabled=false;
}
$("dForm").addEventListener("submit",e=>{e.preventDefault();
  const a=$("fRack").value.trim().toUpperCase().replace(/\s+/g,"");if(!a){$("fStatus").textContent="اكتب الرف الأول، مثلاً A1.";return}
  save({rack:a,drawer:$("fDrawer").value.trim(),box:$("fBox").value.trim(),note:$("fNote").value.trim()});
});
$("fClear").onclick=()=>save({rack:"",drawer:"",box:"",note:""});
async function loadLoc(){
  if(!READY)return;
  try{const r=await fetch(API+"?t="+Date.now());const j=await r.json();if(!j.ok)throw 0;
    for(const k in LOC)delete LOC[k];
    j.rows.forEach(x=>{const id=parseInt(x.id,10);if(!id)return;LOC[id]={rack:String(x.rack||"").trim().toUpperCase(),drawer:String(x.drawer||""),box:String(x.box||""),note:String(x.note||"")}});
    $("sync").textContent="";render();if(current&&$("dlg").open&&document.activeElement.closest&&!document.activeElement.closest("form"))showLoc();
  }catch(e){$("sync").textContent="ما قدرناش نجيبو الأماكن، تأكد من النت";}
}
render();loadLoc();setInterval(loadLoc,60000);
</script>
</body></html>
